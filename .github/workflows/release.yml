# Release on every push to master (i.e. a merged PR) whose package.json version
# is not yet both a GitHub release and an npm version. Bump "version" in the PR
# to cut a release; pushes that keep the version (docs, CI) are no-ops.
#
# One version is one source revision. The revision is the commit the vX.Y.Z tag
# points at when the tag exists (an earlier, partial run created it), else the
# pushed commit. Tests, the GitHub release and the npm publish all use that
# revision, so a run that recovers a failed npm publish after master has moved
# on still publishes what was tagged. Anything that contradicts it (a release
# without its tag, a tagged commit with another version, an npm version built
# from a different commit) stops the run instead of guessing.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          tag="v${version}"
          gh_release=false
          gh release view "$tag" >/dev/null 2>&1 && gh_release=true
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            sha=$(git rev-list -n 1 "$tag")
          elif [ "$gh_release" = true ]; then
            echo "::error::Release $tag exists but its tag does not; cannot tell which revision it is."
            exit 1
          else
            sha="$GITHUB_SHA"
          fi
          tagged=$(git show "${sha}:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [ "$tagged" != "$version" ]; then
            echo "::error::$tag points at $sha, whose package.json says $tagged."
            exit 1
          fi
          on_npm=false
          if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "$version" ]; then
            on_npm=true
            # npm records the commit it was packed from; it must be this one.
            npm_head=$(npm view "${name}@${version}" gitHead 2>/dev/null || true)
            if [ -n "$npm_head" ] && [ "$npm_head" != "$sha" ]; then
              if [ "$gh_release" = true ]; then
                # Already complete; nothing will be published. Rewritten history
                # (old tags re-pointed) leaves this on releases made before it.
                echo "::warning::npm ${name}@${version} was packed from $npm_head, $tag is $sha."
              else
                echo "::error::npm ${name}@${version} was published from $npm_head, not $sha; refusing to release $tag on a different revision."
                exit 1
              fi
            fi
          fi
          {
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "gh_release=${gh_release}"
            echo "on_npm=${on_npm}"
          } >> "$GITHUB_OUTPUT"
          echo "$tag -> $sha; GitHub release: $gh_release, npm: $on_npm"
          if [ "$gh_release" = true ] && [ "$on_npm" = true ]; then
            echo "Release $tag exists on GitHub and npm; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the release revision
        if: steps.version.outputs.skip == 'false'
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: git checkout --detach "$SHA"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: 24
          cache: npm

      - name: Test
        if: steps.version.outputs.skip == 'false'
        run: |
          npm ci
          npm test
          npm run lint
          npm run knip
          npm run typecheck
          # The plugin inside the real OpenCode 2 host (see test.yml): a runtime
          # incompatibility must block publishing, not just turn a badge red.
          npm run test:integration

      - name: Create release
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.gh_release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes --latest

    outputs:
      skip: ${{ steps.version.outputs.skip }}
      on_npm: ${{ steps.version.outputs.on_npm }}
      sha: ${{ steps.version.outputs.sha }}

  # Publishes to npm through trusted publishing: npm authenticates this workflow via
  # OIDC, no token exists. The trusted publisher on npmjs.com is bound to release.yml
  # and environment "npm".
  npm:
    needs: release
    if: needs.release.outputs.skip == 'false' && needs.release.outputs.on_npm == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing
        run: |
          # OIDC trusted publishing needs npm >= 11.5.1.
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a * 1e6 + b * 1e3 + c < 11005001) {
              console.error("::error::npm " + process.argv[1] + " < 11.5.1");
              process.exit(1);
            }' "$(npm --version)"
      - run: npm publish --provenance --access public
